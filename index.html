<span class=\"em-reserve-label\">Réserver<\u002Fspan>\n        <\u002Fa>\n        <a class=\"em-icon\" href=\"https://www.instagram.com/complexeemeria/\" target=\"_blank\" rel=\"noopener\" aria-label=\"Eméria sur Instagram\" style=\"display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 12px; color: #F5EBDD\">\n          <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"5\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><circle cx=\"17.5\" cy=\"6.5\" r=\"0.6\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg>\n        <\u002Fa>\n        <a class=\"em-icon\" href=\"#compte\" aria-label=\"Mon compte\" style=\"display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 12px; color: #F5EBDD\">\n          <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\u002Fcircle><path d=\"M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n        <span aria-hidden=\"true\" style=\"width: 1px; height: 32px; background: rgba(245,235,221,.3)\"><\u002Fspan>\n        <button class=\"em-icon\" type=\"button\" aria-label=\"Rechercher\" style=\"display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 12px; border: 0; background: transparent; color: #F5EBDD; cursor: pointer\">\n          <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M20 20l-4-4\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- HERO -->\n  <section id=\"accueil\" class=\"em-hero\" style=\"background: #0F2E2A; min-height: 520px; position: relative\">\n    <div style=\"padding: clamp(40px, 6vw, 56px) clamp(16px, 4vw, 40px) clamp(40px, 6vw, 48px) clamp(16px, 6.6vw, 96px); display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 2\">\n      <p style=\"margin: 0 0 24px; font-size: 15px; font-weight: 600; letter-spacing: 5px; text-transform: uppercase; line-height: 1.7; color: #F5EBDD\">Complexe de loisirs<br>et de bien-être<\u002Fp>\n      <h1 class=\"em-h1\" style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 600; font-size: 60px; line-height: 1.02; color: #FFFFFF; width: max-content; max-width: 100%\">Votre moment à vous,<br>au même endroit.<\u002Fh1>\n      <span aria-hidden=\"true\" style=\"display: block; width: 64px; height: 3px; background: #D9A55B; margin: 28px 0\"><\u002Fspan>\n      <p style=\"margin: 0 0 32px; font-size: 18px; line-height: 1.5; max-width: 420px; color: #EFE4D4\">Un lieu unique qui réunit sport, bien-être, loisirs, restauration et services du quotidien, pour simplifier votre vie et vous offrir une véritable parenthèse.<\u002Fp>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n        <a class=\"em-btn\" href=\"#activites\" style=\"display: inline-flex; align-items: center; gap: 12px; height: 54px; padding: 0 28px; border-radius: 12px; background: #F6DDB8; color: #0F2E2A; font-weight: 700; font-size: 17px; text-decoration: none\">Découvrir les activités\n          <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n        <a class=\"em-btn em-ghost\" href=\"#pass\" style=\"display: inline-flex; align-items: center; height: 54px; padding: 0 28px; border-radius: 12px; border: 1.5px solid #F5EBDD; color: #FFFFFF; font-weight: 600; font-size: 17px; text-decoration: none\">Le Pass Eméria<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"em-hero-img\" role=\"img\" aria-label=\"Façade vitrée du complexe Eméria au coucher du soleil, avec des visiteurs sur le parvis arboré\" style=\"position: relative\">\n      <div class=\"em-hero-fade\" aria-hidden=\"true\" style=\"position: absolute; inset: 0 auto 0 0; width: 40%; background: linear-gradient(90deg, #0F2E2A 0%, rgba(15,46,42,0) 100%)\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CATEGORIES -->\n  <section id=\"activites\" aria-label=\"Nos activités\" style=\"background: #F1E4D0; padding: 24px clamp(16px, 4vw, 64px)\">\n    <ul class=\"em-cats\" style=\"list-style: none; margin: 0 auto; padding: 0; max-width: 1440px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px 0; color: #0F2E2A\">\n      <sc-for list=\"{{cats}}\" as=\"c\" hint-placeholder-count=\"7\">\n        <li style=\"display: flex; align-items: center\">\n          <sc-if value=\"{{c.sep}}\" hint-placeholder-val=\"{{ true }}\"><span class=\"em-sep\" aria-hidden=\"true\" style=\"width: 1px; height: 32px; background: #CDBBA0; margin-right: clamp(16px, 2.6vw, 40px)\"><\u002Fspan><\u002Fsc-if>\n          <a class=\"em-cat\" href=\"#activites\" style=\"display: flex; align-items: center; gap: 14px; min-height: 48px; padding-right: clamp(16px, 2.6vw, 40px); color: #0F2E2A; text-decoration: none\">\n            <svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 40 40\" fill=\"none\" stroke=\"#0F2E2A\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\n              <sc-if value=\"{{c.isSport}}\"><path d=\"M4 20h32M8 13v14M12 11v18M28 11v18M32 13v14M4 17v6M36 17v6\"><\u002Fpath><\u002Fsc-if>\n              <sc-if value=\"{{c.isSpa}}\"><path d=\"M20 30c-5-3-7-8-7-13 3 1 6 4 7 7 1-3 4-6 7-7 0 5-2 10-7 13zM20 30c-2-4-2-11 0-18 2 7 2 14 0 18zM20 30c-6 0-12-3-14-9 3 0 6 1 8 3M20 30c6 0 12-3 14-9-3 0-6 1-8 3\"><\u002Fpath><\u002Fsc-if>\n              <sc-if value=\"{{c.isCine}}\"><path d=\"M6 16h28v16H6zM6 16l2-7 26-3 1 6zM13 8l3 5M21 7l3 5M29 6l3 5\"><\u002Fpath><\u002Fsc-if>\n              <sc-if value=\"{{c.isKids}}\"><circle cx=\"20\" cy=\"15\" r=\"7\"><\u002Fcircle><circle cx=\"13\" cy=\"9\" r=\"3\"><\u002Fcircle><circle cx=\"27\" cy=\"9\" r=\"3\"><\u002Fcircle><path d=\"M14 22c-3 2-4 6-3 10h18c1-4 0-8-3-10M17 15h.5M22.5 15h.5M18 18c1 1 3 1 4 0\"><\u002Fpath><\u002Fsc-if>\n              <sc-if value=\"{{c.isFood}}\"><path d=\"M12 5v10a3 3 0 006 0V5M15 5v30M26 35V5c-4 3-5 9-5 14h5\"><\u002Fpath><\u002Fsc-if>\n              <sc-if value=\"{{c.isShop}}\"><path d=\"M4 8h5l4 18h18l3-12H11M15 32a2 2 0 100-.1M28 32a2 2 0 100-.1\"><\u002Fpath><\u002Fsc-if>\n              <sc-if value=\"{{c.isCourt}}\"><ellipse cx=\"25\" cy=\"14\" rx=\"9\" ry=\"10\" transform=\"rotate(35 25 14)\"><\u002Fellipse><path d=\"M19 22L7 34M20 9l11 10M24 6l9 8M17 13l10 10\"><\u002Fpath><\u002Fsc-if>\n            <\u002Fsvg>\n            <span style=\"font-size: 16px; font-weight: 600; white-space: nowrap\">{{c.label}}<\u002Fspan>\n          <\u002Fa>\n        <\u002Fli>\n      <\u002Fsc-for>\n    <\u002Ful>\n  <\u002Fsection>\n\n  <!-- PASS + PARTNERS -->\n  <section class=\"em-bottom\" style=\"max-width: 1440px; width: 100%; box-sizing: border-box; margin: 0 auto; padding: 24px clamp(16px, 4vw, 64px) 56px; gap: 48px; align-items: start\">\n    <div id=\"pass\" style=\"background: #0F2E2A; border-radius: 18px; overflow: hidden; display: flex; align-items: stretch; min-height: 216px\">\n      <div style=\"padding: 28px 32px 32px 40px; display: flex; flex-direction: column; justify-content: center; flex: 1 1 auto; min-width: 0\">\n        <h2 style=\"margin: 0 0 16px; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 40px; line-height: 1; color: #FFFFFF\">Le Pass Eméria<\u002Fh2>\n        <p style=\"margin: 0 0 24px; font-size: 17px; line-height: 1.45; color: #EFE4D4; max-width: 340px\">Une seule carte, un accès à toutes vos activités et à des avantages exclusifs.<\u002Fp>\n        <a class=\"em-btn\" href=\"#pass\" style=\"align-self: flex-start; display: inline-flex; align-items: center; gap: 12px; height: 48px; padding: 0 26px; border-radius: 12px; background: #F6DDB8; color: #0F2E2A; font-weight: 700; font-size: 16px; text-decoration: none\">Découvrir le Pass\n          <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n      <\u002Fdiv>\n      <img class=\"em-pass-img\" src=\"27f134b2-eb2f-4c9f-a095-0c66ea85d288\" alt=\"La carte Le Pass Eméria\" style=\"width: 42%; max-width: 300px; object-fit: cover; object-position: left center; flex: 0 0 auto\">\n    <\u002Fdiv>\n\n    <div id=\"partenaires\" style=\"color: #0F2E2A\">\n      <h2 style=\"margin: 0 0 24px; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 40px; line-height: 1\">Nos partenaires<\u002Fh2>\n      <ul class=\"em-partners\" style=\"list-style: none; margin: 0; padding: 0; gap: 14px\">\n        <sc-for list=\"{{partners}}\" as=\"p\" hint-placeholder-count=\"5\">\n          <li class=\"em-partner\" style=\"background: #FFFFFF; border-radius: 12px; height: 72px; display: flex; align-items: center; justify-content: center; padding: 0 10px; text-align: center; box-shadow: 0 1px 3px rgba(15,46,42,.08)\">\n            <span style=\"font-size: 15px; font-weight: 700; letter-spacing: 0.3px; color: #0F2E2A; line-height: 1.15\">{{p.name}}<\u002Fspan>\n          <\u002Fli>\n        <\u002Fsc-for>\n      <\u002Ful>\n      <div style=\"display: flex; justify-content: flex-end; margin-top: 24px\">\n        <a class=\"em-link\" href=\"#partenaires\" style=\"display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; text-underline-offset: 4px; min-height: 44px\">Voir tous les partenaires\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer id=\"apropos\" class=\"em-foot\" style=\"margin-top: auto; background: #0F2E2A; padding: 40px clamp(16px, 4vw, 64px)\">\n    <div style=\"max-width: 1440px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px\">\n      <div>\n        <div style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 34px; color: #FFFFFF; line-height: 1\">Eméria<\u002Fdiv>\n        <div style=\"font-size: 14px; color: #CFC2AE; margin-top: 6px\">Complexe de loisirs et de bien-être<\u002Fdiv>\n      <\u002Fdiv>\n      <a class=\"em-btn\" href=\"https://www.instagram.com/complexeemeria/\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; gap: 12px; height: 52px; padding: 0 24px; border-radius: 12px; border: 1.5px solid #F5EBDD; font-weight: 600; font-size: 16px\">\n        <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"5\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><circle cx=\"17.5\" cy=\"6.5\" r=\"0.6\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg>\n        Suivez-nous sur Instagram · @complexeemeria\n      <\u002Fa>\n      <div style=\"font-size: 14px; color: #CFC2AE\">© {{year}} Complexe Eméria<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1320}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    var cats = [\n      { label: 'Sport & fitness', k: 'Sport' },\n      { label: 'Bien-être & spa', k: 'Spa' },\n      { label: 'Cinéma', k: 'Cine' },\n      { label: 'Garderie', k: 'Kids' },\n      { label: 'Restauration', k: 'Food' },\n      { label: 'Supermarché', k: 'Shop' },\n      { label: 'Terrains de sport', k: 'Court' }\n    ].map(function (c, i) {\n      return {\n        label: c.label, sep: i > 0,\n        isSport: c.k === 'Sport', isSpa: c.k === 'Spa', isCine: c.k === 'Cine',\n        isKids: c.k === 'Kids', isFood: c.k === 'Food', isShop: c.k === 'Shop', isCourt: c.k === 'Court'\n      };\n    });\n    return {\n      cats: cats,\n      partners: [\n        { name: 'Fitness Park' },\n        { name: 'Spa Dao' },\n        { name: 'Imagix Cinéma' },\n        { name: 'Delhaize' },\n        { name: 'Big Mamma' }\n      ],\n      year: new Date().getFullYear()\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
